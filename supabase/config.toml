# Supabase CLI configuration for MealJournal.
# Local stack: `npx supabase start`. Hosted project: `npx supabase link --project-ref <ref>`.
# The [auth] settings below apply to the local stack only: mirror them in the hosted
# dashboard (Authentication → Sign In / Providers, Rate Limits, Emails). See README.
project_id = "mealjournal"

[auth]
# Replace with your deployed URL for production (or set it in the dashboard).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173", "http://127.0.0.1:5174"]
# Invite-only: accounts are created by the project owner (dashboard → Authentication → Add user).
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Despite its name this switches the email provider itself on (needed for sign-in codes);
# new accounts are still blocked by `[auth] enable_signup = false` above.
enable_signup = true
# One-time codes: 6 digits, valid for 10 minutes, at most one email per address per minute.
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.rate_limit]
# Emails sent per hour (only enforced with custom SMTP – required in production anyway).
email_sent = 10
# Sign-in requests and code verifications per 5 minutes per IP address.
sign_in_sign_ups = 10
token_verifications = 10
token_refresh = 150
anonymous_users = 0

# The template includes the one-time code, so you can sign in inside the installed app.
[auth.email.template.magic_link]
subject = "Your MealJournal sign-in code"
content_path = "./supabase/templates/magic_link.html"

[functions.get-shared-report]
# Recipients have no account: the function authorises access itself via the share token.
verify_jwt = false
